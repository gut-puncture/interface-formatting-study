[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-formatting-study"
version = "0.1.0"
description = "Diagnostics for interface-formatting effects in multiple-choice language-model evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "torch>=2.0",
  "transformers>=4.44",
  "pyarrow>=14.0",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "protobuf>=4.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
interface-formatting-study = "interface_formatting_study.cli:main"
interface_formatting_study = "interface_formatting_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
